name: Diagnose material button
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diagnose-material.yml"
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect generated core
        run: |
          cat dist/*.txt | base64 -d | gzip -dc > /tmp/index.html
          grep -n -o ".\{0,700\}startShoppingTopic.\{0,1500\}" /tmp/index.html || true
          grep -n -o ".\{0,700\}showShoppingSource.\{0,1500\}" /tmp/index.html || true
