name: Diagnose material button
on:
  push:
    paths:
      - ".github/workflows/diagnose-material.yml"
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect core topic/session functions
        run: |
          cat dist/*.txt | base64 -d | gzip -dc > /tmp/index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/index.html').read_text(encoding='utf-8')
          for q in ['function save()','function save(','function activateTopic','function openSession','function renderToday','function renderAll']:
              i=s.find(q)
              print('\n===',q,'AT',i,'===')
              if i>=0: print(s[i:i+2600])
          PY
