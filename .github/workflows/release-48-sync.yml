name: Release 4.8 sync
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch and validate
        run: |
          python3 tools/patch_48.py
          python3 -m py_compile server.py
          node --check ai-import.js
          python3 - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('srv','server.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          open('/tmp/cloud-sync.js','w',encoding='utf-8').write(m.CLOUD_SYNC_JS)
          PY
          node --check /tmp/cloud-sync.js
          grep -q '^version=4.8$' manifest.txt
          grep -q '/api/library' server.py
      - name: Commit release
        run: |
          rm -f .github/workflows/release-48-sync.yml tools/patch_48.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py manifest.txt .github/workflows/release-48-sync.yml tools/patch_48.py
          git commit -m "Release 4.8 robust cross-device library sync"
          git push
