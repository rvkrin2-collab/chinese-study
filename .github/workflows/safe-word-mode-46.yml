name: Safe word-only import 4.6
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch 4.6 safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('ai-import.js')
          s=p.read_text(encoding='utf-8')

          modal_re=r"function modal\(\)\{.*?\}\nfunction status"
          modal_new=r'''function importMode(){return document.querySelector('#aiMatModal input[name="aimStudyMode"]:checked')?.value||'full'}
          function syncImportMode(){const m=document.getElementById('aiMatModal');if(!m)return;const words=importMode()==='words',n=m.querySelector('#aimModeNote');if(n)n.textContent=words?'Будут сохранены только выбранные новые слова. Отдельный урок — лексика и аудирование.':'Полная тема: слова, грамматика, чтение, сборка фраз и активный перевод.'}
          function modal(){let m=document.getElementById('aiMatModal');if(m)return m;m=document.createElement('div');m.id='aiMatModal';m.innerHTML=`<div class="aim-box"><div class="aim-head"><div><div class="eyebrow">+ 新材料 · MiniMax</div><h2 style="margin:5px 0">Добавить материал урока</h2><p style="margin:4px 0;color:var(--mut,#777)">Фото, скриншот, PDF или текст → учебный материал.</p></div><button class="aim-close" aria-label="Закрыть">×</button></div><div class="aim-drop"><input id="aimFile" type="file" accept="image/png,image/jpeg,image/webp,.pdf,.txt,text/plain"><div class="tiny" style="margin-top:7px">JPG / PNG / WebP / PDF / TXT · до 12 МБ · файл не сохраняется на VPS</div></div><div style="margin:12px 0;padding:12px;border:1px solid var(--line,#ddd);border-radius:12px;background:var(--paper2,#fafafa)"><div style="font-weight:800;margin-bottom:8px">Режим изучения</div><div style="display:flex;gap:18px;flex-wrap:wrap"><label style="display:flex;gap:7px;align-items:center"><input type="radio" name="aimStudyMode" value="full" checked> Полная тема</label><label style="display:flex;gap:7px;align-items:center"><input type="radio" name="aimStudyMode" value="words"> Только новые слова</label></div><div class="tiny" id="aimModeNote" style="margin-top:7px"></div></div><div class="tiny">или вставь текст</div><textarea class="aim-text" id="aimText" placeholder="例如：今天我们学习了购物、质量和广告……"></textarea><div class="aim-actions"><button class="primary" id="aimAnalyze">Разобрать материал</button></div><div class="aim-status" id="aimStatus"></div><div class="aim-preview" id="aimPreview"></div></div>`;document.body.appendChild(m);m.querySelector('.aim-close').onclick=()=>m.classList.remove('open');m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open')});m.querySelector('#aimAnalyze').onclick=analyze;m.querySelectorAll('input[name="aimStudyMode"]').forEach(r=>r.onchange=syncImportMode);syncImportMode();return m}
          function status'''
          s,n=re.subn(modal_re,modal_new,s,count=1,flags=re.S)
          assert n==1, 'modal patch not applied'

          analyze_re=r"async function analyze\(\)\{.*?\}\nfunction preview"
          analyze_new=r'''async function analyze(){const btn=document.getElementById('aimAnalyze'),file=document.getElementById('aimFile').files[0],text=document.getElementById('aimText').value.trim(),mode=importMode();if(!file&&!text)return status('Добавь фото, PDF или текст.','err');if(file&&file.size>12*1024*1024)return status('Файл больше 12 МБ.','err');btn.disabled=true;pending=null;document.getElementById('aimPreview').innerHTML='';status(mode==='words'?'MiniMax ищет полезные новые слова…':'MiniMax читает материал и собирает тему…','busy');try{const body={text,filename:file?.name||'',mime_type:file?.type||'',study_mode:mode};if(file)body.data_base64=await b64(file);const r=await fetch('api/materials/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`Ошибка сервера ${r.status}`);pending={...d,_fileName:file?.name||'',_studyMode:mode};preview();status('Разбор готов. Проверь слова перед добавлением.','ok')}catch(e){status(esc(e.message||e),'err')}finally{btn.disabled=false}}
          function preview'''
          s,n=re.subn(analyze_re,analyze_new,s,count=1,flags=re.S)
          assert n==1, 'analyze patch not applied'

          pc_re=r"function preview\(\)\{.*?\}\nfunction confirm\(\)\{.*?\}\nfunction topicById"
          pc_new=r'''function preview(){const x=pending,e=document.getElementById('aimPreview');if(!x){e.innerHTML='';return}const wordsOnly=x._studyMode==='words';const grammar=wordsOnly?'':`<h3>语法 · конструкции</h3>${(x.grammar||[]).map(g=>`<div class="aim-grammar"><b>${esc(g.pattern)}</b> — ${esc(g.meaning_ru)}<div>${esc(g.example_cn)}</div><small>${esc(g.example_pinyin)}</small></div>`).join('')}`;e.innerHTML=`<div class="aim-title">${esc(x.title_cn)}</div><div class="aim-py">${esc(x.title_pinyin)} · ${esc(x.title_ru)}</div><p>${esc(x.summary_ru)}</p><div class="tiny" style="margin:8px 0"><b>${wordsOnly?'Режим: только новые слова':'Режим: полная тема'}</b></div><h3>生词 · новая лексика</h3><div class="aim-words">${(x.words||[]).map((w,i)=>`<label class="aim-word"><input type="checkbox" data-i="${i}" checked><b>${esc(w.hanzi)}</b><small>${esc(w.pinyin)}</small><span>${esc(w.translation_ru)}</span></label>`).join('')}</div>${grammar}<details><summary>Распознанный текст</summary><div style="white-space:pre-wrap;font:19px/1.7 Georgia,serif;margin-top:8px">${esc(x.source_text_cn)}</div><div style="white-space:pre-wrap;color:var(--mut,#777)">${esc(x.source_pinyin)}</div></details><div class="aim-actions"><button class="primary" id="aimConfirm">${wordsOnly?'Добавить слова и начать':'Добавить и начать изучать'}</button><button class="ghost" id="aimCancel">Отмена</button></div>`;document.getElementById('aimConfirm').onclick=confirm;document.getElementById('aimCancel').onclick=()=>{pending=null;preview()}}
          function confirm(){if(!pending)return;try{ensureState();const x=pending,mode=x._studyMode==='words'?'words':'full',tid='topic_'+Date.now(),checks=[...document.querySelectorAll('#aimPreview input[type=checkbox]:checked')].map(c=>+c.dataset.i),ids=[];if(!checks.length)return status('Выбери хотя бы одно слово.','err');checks.forEach((idx,n)=>{const w=x.words[idx],id=tid+'_w'+n,nw={id,h:w.hanzi,p:w.pinyin,r:w.translation_ru,l:Number(w.hsk_level)||4,t:w.translation_ru,e:`${w.example_cn}|${w.example_pinyin}|${w.example_ru}`};state.customWords.push(nw);if(Array.isArray(WORDS)&&!WORDS.some(z=>String(z.id)===String(id)))WORDS.push(nw);ids.push(id)});const full=mode==='full',topic={id:tid,title:x.title_cn,pinyin:x.title_pinyin,ru:x.title_ru,wordIds:ids,studyMode:mode,grammar:full?(x.grammar||[]).map(g=>({q:g.question,opts:g.options,a:g.answer,note:`${g.pattern} — ${g.meaning_ru}`})):[],readings:full?(x.readings||[]).map(r=>({cn:r.cn,py:r.pinyin,q:r.question,opts:r.options,a:r.answer_index})):[],builds:full?(x.builds||[]).map(b=>({tokens:b.tokens,ans:b.answer,py:b.pinyin,ru:b.translation_ru})):[],productions:full?(x.productions||[]).map(p=>({ru:p.prompt_ru,ans:p.answers,py:p.pinyin})):[],sourceText:x.source_text_cn,sourcePinyin:x.source_pinyin};state.customTopics.push(topic);state.materials=[...state.materials,{id:'m'+Date.now(),topicId:tid,ts:Date.now(),title:x.title_cn,preview:x.summary_ru,wordIds:ids,fileName:x._fileName||'',studyMode:mode}].slice(-30);state.activeTopic={id:tid,started:Date.now(),until:Date.now()+3*86400000};if(mode==='words'){state.topicLessonNext=null;state.strictTopicNext=tid}else{state.strictTopicNext=null;state.topicLessonNext=tid}pending=null;save();document.getElementById('aiMatModal').classList.remove('open');setTimeout(()=>openSession(),0)}catch(e){status('Не удалось добавить тему: '+esc(e.message||e),'err')}}
          function topicById'''
          s,n=re.subn(pc_re,pc_new,s,count=1,flags=re.S)
          assert n==1, 'preview/confirm patch not applied'

          start_re=r"startCustomTopic=function\(id\)\{.*?\};window\.startFocusedTopicLesson=function\(\)\{.*?\};\nconst baseRenderToday"
          start_new=r'''startCustomTopic=function(id){ensureState();const t=topicById(id);if(!t)return;state.activeTopic={id,started:now(),until:now()+3*DAY};if(t.studyMode==='words'){state.topicLessonNext=null;state.strictTopicNext=id}else{state.strictTopicNext=null;state.topicLessonNext=id}try{localStorage.setItem(KEY,JSON.stringify(state))}catch{};openSession()};window.startFocusedTopicLesson=function(){const t=getActiveTopic();if(!t)return;if(t.studyMode==='words'){state.topicLessonNext=null;state.strictTopicNext=t.id}else{state.strictTopicNext=null;state.topicLessonNext=t.id}try{localStorage.setItem(KEY,JSON.stringify(state))}catch{};openSession()};
          const baseRenderToday'''
          s,n=re.subn(start_re,start_new,s,count=1,flags=re.S)
          assert n==1, 'topic start patch not applied'

          p.write_text(s,encoding='utf-8')

          sp=Path('server.py')
          ss=sp.read_text(encoding='utf-8')
          ss=ss.replace('ChineseStudy/4.4','ChineseStudy/4.6').replace('"version":"4.4"','"version":"4.6"').replace('topic-study.js?v=4.4','topic-study.js?v=4.6').replace('Chinese Study 4.4 + MiniMax','Chinese Study 4.6 + MiniMax')
          ss=ss.replace('b.textContent="Изучать этот материал";','b.textContent=t.studyMode==="words"?"Изучать слова":"Изучать этот материал";')
          sp.write_text(ss,encoding='utf-8')

          Path('manifest.txt').write_text('version=4.6\nsha256=4a8fa933b600fb3cfe6614ae72d8fa2c3a3e7a35c149cdb250b4555cc9ef70b9\nchunks=5\n',encoding='utf-8')
          PY
          node --check ai-import.js
          python3 -m py_compile server.py
          rm -f .github/workflows/safe-word-mode-46.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ai-import.js server.py manifest.txt .github/workflows/safe-word-mode-46.yml
          git commit -m "Release safe word-only material mode 4.6"
          git push
