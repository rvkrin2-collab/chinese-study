name: E2E Materials launch
on:
  push:
    paths:
      - "ai-import.js"
      - "server.py"
      - "manifest.txt"
      - ".github/workflows/e2e-materials-live.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Start current app locally
        run: |
          cat dist/*.txt | base64 -d | gzip -dc > index.html
          CHINESE_STUDY_DIR="$PWD" CHINESE_STUDY_PORT=8910 CHINESE_STUDY_HOST=127.0.0.1 python3 server.py >/tmp/chinese-study.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8910/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8910/api/health
          curl -fsS http://127.0.0.1:8910/ | grep -F 'ai-import.js?v=7.0'
          curl -fsS -D /tmp/ai-headers.txt -o /dev/null http://127.0.0.1:8910/ai-import.js?v=7.0
          grep -qi 'cache-control: no-store' /tmp/ai-headers.txt
      - name: Browser diagnose Materials page
        run: |
          cat > test-materials.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1280,height:900}});
          page.on('pageerror', e => console.log('PAGEERROR', e.message));
          page.on('console', m => console.log('CONSOLE', m.type(), m.text()));

          await page.goto('http://127.0.0.1:8910/', {waitUntil:'networkidle', timeout:60000});
          console.log('READY', await page.evaluate(()=>document.readyState));

          const onboarding=page.locator('.course-onboarding');
          if(await onboarding.count() && await onboarding.isVisible().catch(()=>false)){
            const h3=onboarding.getByRole('button',{name:/HSK 3/i});
            if(await h3.count()) await h3.first().click();
          }

          const nav=page.locator('[data-view="materials"]');
          console.log('NAV_COUNT',await nav.count());
          await nav.first().click();
          await page.waitForTimeout(300);
          console.log('VIEW_VISIBLE',await page.locator('#view-materials').isVisible());

          const btn=page.locator('#startShoppingTopic');
          console.log('BUILTIN_VISIBLE',await btn.isVisible());
          console.log('BUILTIN_ONCLICK',await page.evaluate(()=>String(document.getElementById('startShoppingTopic')?.onclick)));
          console.log('BEFORE_BUILTIN',await page.evaluate(()=>({session:document.getElementById('session')?.className,active:state?.activeTopic,strict:state?.strictTopicNext,forced:state?.topicLessonNext})));
          await btn.click();
          await page.waitForTimeout(500);
          console.log('AFTER_BUILTIN',await page.evaluate(()=>({session:document.getElementById('session')?.className,display:getComputedStyle(document.getElementById('session')).display,active:state?.activeTopic,strict:state?.strictTopicNext,forced:state?.topicLessonNext,phase:document.getElementById('phase')?.textContent})));

          const close=page.locator('#closeSession');
          if(await close.count()) await close.click().catch(()=>{});

          await page.evaluate(() => {
            const now=Date.now(), wid='e2e_word';
            if(!WORDS.some(w=>String(w.id)===wid)) WORDS.push({id:wid,h:'测试',p:'cèshì',r:'тестировать',l:3,t:'e2e',e:'这是一个测试。|Zhè shì yí ge cèshì.|Это тест.'});
            state.customTopics=[...(state.customTopics||[]).filter(t=>t.id!=='e2e_topic'),{id:'e2e_topic',title:'测试材料',pinyin:'cèshì cáiliào',ru:'тестовый материал',wordIds:[wid],studyMode:'words',grammar:[],readings:[],builds:[],productions:[]}];
            state.materials=[...(state.materials||[]).filter(m=>m.id!=='e2e_material'),{id:'e2e_material',topicId:'e2e_topic',ts:now,title:'测试材料',preview:'Тестовый материал',wordIds:[wid],studyMode:'words'}];
            save();renderMaterials();
          });
          await page.waitForTimeout(800);

          console.log('CUSTOM_HTML',await page.locator('#customMaterials').innerHTML());
          const custom=page.locator('#customMaterials .study-only-btn').last();
          console.log('CUSTOM_COUNT',await custom.count());
          if(await custom.count()){
            console.log('CUSTOM_ONCLICK',await custom.evaluate(el=>String(el.onclick)));
            console.log('BEFORE_CUSTOM',await page.evaluate(()=>({session:document.getElementById('session')?.className,active:state?.activeTopic,strict:state?.strictTopicNext,forced:state?.topicLessonNext})));
            await custom.click();
            await page.waitForTimeout(500);
            console.log('AFTER_CUSTOM',await page.evaluate(()=>({session:document.getElementById('session')?.className,display:getComputedStyle(document.getElementById('session')).display,active:state?.activeTopic,strict:state?.strictTopicNext,forced:state?.topicLessonNext,phase:document.getElementById('phase')?.textContent})));
          }
          await page.screenshot({path:'materials-e2e-diagnostic.png',fullPage:true});
          await browser.close();
          JS
          node test-materials.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: materials-e2e-screenshot
          path: materials-e2e-*.png
          if-no-files-found: ignore
