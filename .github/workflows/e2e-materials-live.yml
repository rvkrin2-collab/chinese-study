name: E2E Materials launch
on:
  push:
    paths:
      - "ai-import.js"
      - "server.py"
      - "manifest.txt"
      - ".github/workflows/e2e-materials-live.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Start current app locally
        run: |
          cat dist/*.txt | base64 -d | gzip -dc > index.html
          CHINESE_STUDY_DIR="$PWD" CHINESE_STUDY_PORT=8910 CHINESE_STUDY_HOST=127.0.0.1 python3 server.py >/tmp/chinese-study.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8910/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8910/api/health
          curl -fsS http://127.0.0.1:8910/ | grep -F 'ai-import.js?v=6.9'
          curl -fsS -D /tmp/ai-headers.txt -o /dev/null http://127.0.0.1:8910/ai-import.js?v=6.9
          grep -qi 'cache-control: no-store' /tmp/ai-headers.txt
      - name: Browser test Materials page
        run: |
          cat > test-materials.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1280,height:900}});
          const errors=[];
          page.on('pageerror', e => errors.push(e.message));
          page.on('console', m => { if(m.type()==='error') errors.push(m.text()); });

          await page.goto('http://127.0.0.1:8910/', {waitUntil:'networkidle', timeout:60000});

          const onboarding=page.locator('.course-onboarding');
          if(await onboarding.count() && await onboarding.isVisible().catch(()=>false)){
            const h3=onboarding.getByRole('button',{name:/HSK 3/i});
            if(await h3.count()) await h3.first().click();
          }

          const nav=page.locator('[data-view="materials"]');
          if(!await nav.count()) throw new Error('Materials nav missing');
          await nav.first().click();
          await page.waitForTimeout(300);

          const view=page.locator('#view-materials');
          if(!await view.isVisible()) throw new Error('Materials view did not become visible');

          const btn=page.locator('#startShoppingTopic');
          if(!await btn.isVisible()) throw new Error('Start Topic button not visible on Materials page');
          await btn.click();
          await page.waitForTimeout(300);

          const session=page.locator('#session');
          if(!await session.isVisible()) throw new Error('Built-in topic did not open session from Materials page');
          if(!(await session.getAttribute('class')||'').includes('open')) throw new Error('Session lacks open class');
          console.log('BUILTIN_OK', await page.locator('#phase').innerText());

          // Close and test a saved custom material using the same page.
          const close=page.locator('#closeSession');
          if(await close.count()) await close.click();
          await page.evaluate(() => {
            const now=Date.now();
            state.customWords = state.customWords || [];
            const wid='e2e_word';
            if(!WORDS.some(w=>String(w.id)===wid)){
              WORDS.push({id:wid,h:'测试',p:'cèshì',r:'тестировать',l:3,t:'e2e',e:'这是一个测试。|Zhè shì yí ge cèshì.|Это тест.'});
            }
            state.customTopics = [...(state.customTopics||[]).filter(t=>t.id!=='e2e_topic'), {
              id:'e2e_topic',title:'测试材料',pinyin:'cèshì cáiliào',ru:'тестовый материал',
              wordIds:[wid],studyMode:'words',grammar:[],readings:[],builds:[],productions:[]
            }];
            state.materials = [...(state.materials||[]).filter(m=>m.id!=='e2e_material'), {
              id:'e2e_material',topicId:'e2e_topic',ts:now,title:'测试材料',
              preview:'Тестовый материал',wordIds:[wid],studyMode:'words'
            }];
            save();
            renderMaterials();
          });
          await page.waitForTimeout(500);

          const custom=page.locator('#customMaterials .study-only-btn').last();
          if(!await custom.count()) throw new Error('Saved-material study button missing');
          await custom.click();
          await page.waitForTimeout(300);
          if(!await session.isVisible()) throw new Error('Saved material did not open session from Materials page');
          console.log('CUSTOM_OK', await page.locator('#phase').innerText());

          if(errors.length) console.log('BROWSER_ERRORS', JSON.stringify(errors));
          await page.screenshot({path:'materials-e2e-success.png', fullPage:true});
          await browser.close();
          JS
          node test-materials.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: materials-e2e-screenshot
          path: materials-e2e-*.png
          if-no-files-found: ignore
