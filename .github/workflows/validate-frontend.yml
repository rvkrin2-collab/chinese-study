name: Validate Chinese Study frontend
on:
  push:
    paths:
      - "ai-import.js"
      - "manifest.txt"
      - ".github/workflows/validate-frontend.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend
        run: |
          node --check ai-import.js
          grep -q '^version=6.8$' manifest.txt
          grep -Fq "launchMaterialTopic('shopping')" ai-import.js
          grep -Fq "document.getElementById('startShoppingTopic')" ai-import.js
          grep -Fq "card?.id?.startsWith('topic-')" ai-import.js
