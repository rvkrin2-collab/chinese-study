name: Repair Materials topic launch
on:
  push:
    paths:
      - '.github/workflows/repair-material-launch.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Restore ai-import and add robust launcher
        run: |
          git show HEAD^:ai-import.js > ai-import.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ai-import.js')
          s=p.read_text(encoding='utf-8')
          anchor="function wire(){css();modal();"
          assert anchor in s
          helper=r'''function launchMaterialTopic(id){
            ensureState();
            const topicId=String(id||'').trim();
            let t=topicById(topicId);
            if(!t&&Array.isArray(state.materials)){
              const m=state.materials.find(x=>String(x.topicId||'')===topicId||String(x.id||'')===topicId);
              if(m?.topicId)t=topicById(m.topicId);
            }
            if(!t){alert('Тема не найдена в сохранённых материалах. Обнови страницу; если ошибка останется, материал нужно восстановить из серверной библиотеки.');return false;}
            state.activeTopic={id:t.id,started:now(),until:now()+3*DAY};
            if(t.studyMode==='words'){state.topicLessonNext=null;state.strictTopicNext=t.id}else{state.strictTopicNext=null;state.topicLessonNext=t.id}
            try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}
            try{save()}catch{}
            openSession();
            return true;
          }
          window.startCustomTopic=launchMaterialTopic;
          document.addEventListener('click',e=>{
            const b=e.target?.closest?.('#customMaterials button');
            if(!b)return;
            const txt=String(b.textContent||'').trim();
            if(!/Начать тему|Изучать эту тему|Изучать этот материал/i.test(txt))return;
            const raw=b.getAttribute('onclick')||'';
            const m=raw.match(/startCustomTopic\((?:'|\")([^'\"]+)(?:'|\")\)/);
            const card=b.closest('.topiccard');
            const id=m?.[1]||b.dataset.topicId||card?.dataset.topicId||'';
            if(!id)return;
            e.preventDefault();e.stopImmediatePropagation();
            launchMaterialTopic(id);
          },true);
          '''
          s=s.replace(anchor,helper+anchor,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check ai-import.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('manifest.txt')
          s=p.read_text()
          s=s.replace('version=6.5','version=6.6')
          p.write_text(s)
          PY
      - name: Commit repaired release
        run: |
          rm -f .github/workflows/repair-material-launch.yml .github/workflows/fix-material-topic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-import.js manifest.txt .github/workflows
          git commit -m 'Release 6.6: repair Materials topic launch'
          git push
