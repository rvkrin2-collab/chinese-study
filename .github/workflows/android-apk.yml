name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - "curriculum/**"
      - "curriculum-app.js"
      - "server.py"
      - "ai-import.js"
      - "tests/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"


      - name: Install Capacitor
        working-directory: android-app
        run: npm install --no-audit --no-fund

      - name: Validate web client
        run: |
          node --check ai-import.js
          node --check curriculum-app.js
          python3 curriculum/validate_curriculum.py

      - name: Test state migration and persistence
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Install browser for end-to-end test
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Test Curriculum in browser
        run: |
          mkdir -p /tmp/chinese-study-e2e/curriculum /tmp/chinese-study-e2e-state
          cat dist/*.txt | base64 -d | gzip -dc > /tmp/chinese-study-e2e/index.html
          cp server.py ai-import.js curriculum-app.js /tmp/chinese-study-e2e/
          cp curriculum/curriculum-v1.json /tmp/chinese-study-e2e/curriculum/
          CHINESE_STUDY_DIR=/tmp/chinese-study-e2e \
          CHINESE_STUDY_STATE_FILE=/tmp/chinese-study-e2e-state/state.json \
          CHINESE_STUDY_LIBRARY_FILE=/tmp/chinese-study-e2e-state/library.json \
          CHINESE_STUDY_PORT=18910 \
          python3 /tmp/chinese-study-e2e/server.py >/tmp/chinese-study-e2e.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:18910/api/health && break
            sleep 1
          done
          CHINESE_STUDY_TEST_URL=http://127.0.0.1:18910/ node tests/curriculum-e2e.mjs

      - name: Generate Android project
        working-directory: android-app
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          python3 customize_android.py

      - name: Build debug APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk dist/ChineseStudy.apk
          ls -lh dist/ChineseStudy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ChineseStudy-Android
          path: dist/ChineseStudy.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v0.3.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/ChineseStudy.apk             --target "$GITHUB_SHA"             --title "Китайский Android 0.3.${GITHUB_RUN_NUMBER}"             --notes "Android 0.3: Curriculum 1.0 для HSK 1–4, выбор стартового уровня, дорожка курса, синхронизация прогресса и интервальные повторения. Камера и загрузка нескольких материалов сохранены; ключ MiniMax остаётся только на сервере."
