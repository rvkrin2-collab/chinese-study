name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"


      - name: Install Capacitor
        working-directory: android-app
        run: npm install --no-audit --no-fund

      - name: Validate web client
        run: node --check ai-import.js

      - name: Generate Android project
        working-directory: android-app
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          python3 customize_android.py

      - name: Build debug APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk dist/ChineseStudy.apk
          ls -lh dist/ChineseStudy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ChineseStudy-Android
          path: dist/ChineseStudy.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v0.2.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/ChineseStudy.apk             --target "$GITHUB_SHA"             --title "Китайский Android 0.2.${GITHUB_RUN_NUMBER}"             --notes "Android 0.2: фирменная иконка 中, splash-screen, корректная кнопка Назад и камера для добавления учебных материалов. Учебный контент обновляется с VPS без переустановки APK."
